name: Assign PRs

# Assign every new pull request to the repository's maintainer.
# pull_request_target runs this file from the base branch with a write token,
# so it also covers Dependabot and fork PRs. It never checks out PR code.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr edit "$PR" --repo "$REPO" --add-assignee claudio525
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
