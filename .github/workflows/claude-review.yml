name: Claude PR Review

# Triggered by a "@claude review" comment on a pull request, and once
# automatically when a human's PR is opened ready for review or taken out of
# draft (never on push).
#
# issue_comment runs in the base repository's context with secrets available,
# so "@claude review" works on every PR, including forks. The action checks
# that the commenting user has write access before doing anything. GitHub
# withholds secrets from pull_request runs for fork PRs, so the automatic
# review skips forks (and drafts, and bot PRs); comment on those instead.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    uses: ucgmsim/meta-ci-action/.github/workflows/claude-review.yml@main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
