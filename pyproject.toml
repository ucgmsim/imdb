[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "imdb"
authors = [{name="ucgmsim"}]
description = "A library for reading and writing intensity measure databases"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "duckdb>=1.5",
    "numpy>=2",
    "pandas>=3",
]

[dependency-groups]
test = [
  "pytest",
  "pytest-cov",
  "coverage[toml]",
]
types = [
  "pandas-stubs",
  "ty",
]
dev = ["ruff", "deptry", "ty", "numpydoc"]

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["imdb*"]

[tool.ruff.lint]
extend-select = [
  # isort imports
  "I",
  # Use r'\s+' rather than '\s+'
  "W605",
  # All the naming errors, like using camel case for function names.
  "N",
  # Missing docstrings in classes, methods, and functions
  "D101",
  "D102",
  "D103",
  "D105",
  "D107",
  # Use f-string instead of a format call
  "UP032",
  # Standard library import is deprecated
  "UP035",
  # Missing function argument type-annotation
  "ANN001",
  # Using except without specifying an exception type to catch
  "BLE001"
]
ignore = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["imdb", "qcore", "IM", "workflow", "source_modelling"]

[tool.ruff.lint.per-file-ignores]
# Ignore no docstring in __init__.py
"__init__.py" = ["D104"]
# Ignore docstring errors and fixture annotations in tests folder
"tests/**.py" = ["D", "ANN001"]

[tool.numpydoc_validation]
checks = [
  "GL05",
  "GL08",
  "GL10",
  "PR01",
  "PR02",
  "PR03",
  "PR04",
  "PR05",
  "PR06",
  "PR07",
  "RT01",
  "RT02",
  "RT03",
  "RT04",
  "YD01",
]
# remember to use single quotes for regex in TOML
exclude = [
  '\.__repr__$',
  '\.__exit__$',
  '\.__enter__$',
]
